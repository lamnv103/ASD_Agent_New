[project]
name = "asd-rag"
version = "0.1.0"
description = "ASD knowledge RAG agent (Vietnamese answers, evidence-grounded)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tokenizers>=0.20",
    "httpx>=0.27",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9",
    # Exact version: page maps reproduce the old converter byte for byte (app/ingest/pdf_page_map.py).
    "pypdf==6.11.0",
    "pdfplumber>=0.11,<0.12",  # MIT; table candidates for human review (scripts/pdf_table_recovery.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic characters that occur in the source documents and must be matched literally by regexes.
allowed-confusables = ["–", "’", "×", "−"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running database or external API (deselected by default)"]
addopts = "-m 'not integration'"
pythonpath = ["."]
